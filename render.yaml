services:
  - type: web
    name: ai-pdf-assistant
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_BASE
        value: "https://api.groq.com/openai/v1"
      - key: OPENAI_API_KEY
        sync: false            # set manually in Render dashboard
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: RENDER
        value: "true"
